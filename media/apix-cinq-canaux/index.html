<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>APIX — une seule cotation, un seul bon</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e2436;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
      }
    </style>
  </head>

    <script>
      // La composition hôte n'anime rien elle-même : chaque cadre porte sa propre timeline.
      const master = gsap.timeline({ paused: true });
      window.__timelines["main"] = master;
      master.seek(0);
    </script>
